name: Process and Report PR

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      checkout_branch:
        required: false
        type: string
        default: ""

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRPC_KEY: ${{ secrets.DRPC_KEY }}
      ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
      ARBISCAN_TOKEN: ${{ secrets.ARBISCAN_TOKEN }}
      GNOSISSCAN_TOKEN: ${{ secrets.GNOSISSCAN_TOKEN }}
      POLYGONSCAN_TOKEN: ${{ secrets.POLYGONSCAN_TOKEN }}
      OPTIMISMSCAN_TOKEN: ${{ secrets.OPTIMISMSCAN_TOKEN }}
      ZKEVMSCAN_TOKEN: ${{ secrets.ZKEVMSCAN_TOKEN }}
      SNOWTRACE_TOKEN: ${{ secrets.SNOWTRACE_TOKEN }}
      SNOWSCAN_TOKEN: ${{ secrets.SNOWSCAN_TOKEN }}
      BASESCAN_TOKEN: ${{ secrets.BASESCAN_TOKEN }}
      TENDERLY_ACCESS_KEY: ${{ secrets.TENDERLY_ACCESS_KEY }}
      TENDERLY_ACCOUNT_NAME: ${{ secrets.TENDERLY_ACCOUNT_NAME }}
      TENDERLY_PROJECT_NAME: ${{ secrets.TENDERLY_PROJECT_NAME }}
      PR_NUMBER: ${{ inputs.pr_number }}
      COMMIT_SHA: ${{ inputs.checkout_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Switch to PR branch
        if: inputs.checkout_branch != ''
        run: git checkout -B ${{ inputs.checkout_branch }} && git branch --set-upstream-to=origin/${{ inputs.checkout_branch }}

      - name: Restore Compiler Caches
        id: restore-compiler-caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.solcx
            ~/.vvm
          key: evm-compiler-caches

      - name: Setup Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Setup Environment
        run: |
          cd action-scripts/brownie
          pip install -r requirements-actions.txt
          touch .env
          pwd

      - name: Generate Validation Report
        id: validation-report
        run: |
          export COMMIT_SHA=`git rev-parse HEAD`
          cd action-scripts/brownie
          brownie run --network mainnet scripts/validate_bip.py

      - name: Generate Payload report
        id: gen-report
        continue-on-error: false
        run: |
          export COMMIT_SHA=`git rev-parse HEAD`
          cd action-scripts/brownie
          brownie run --network mainnet scripts/reports.py

      - name: Check for comment files
        id: check_files
        run: |
          if [ -f "action-scripts/brownie/validate_bip_results.txt" ]; then
            echo "validation_exists=true" >> $GITHUB_OUTPUT
          else
            echo "validation_exists=false" >> $GITHUB_OUTPUT
          fi

          if [ -f "action-scripts/brownie/payload_reports.txt" ]; then
            echo "payload_reports=true" >> $GITHUB_OUTPUT
          else
            echo "payload_reports=false" >> $GITHUB_OUTPUT
          fi

      # Replaces thollander/actions-comment-pull-request@v3 (node20 deprecated) with
      # actions/github-script@v9 (node24). Keeps the same hidden comment-tag markers so
      # existing validation/payload PR comments continue to upsert.
      # Scripts are inlined (not a local composite) because this job checks out the PR head.
      - name: Post Validation Report as Comment
        continue-on-error: false
        if: steps.check_files.outputs.validation_exists == 'true'
        uses: actions/github-script@v9
        env:
          REPORT_FILE: action-scripts/brownie/validate_bip_results.txt
          COMMENT_TAG: validation_report
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const filePath = process.env.REPORT_FILE;
            const commentTag = process.env.COMMENT_TAG;
            const issueNumber = Number(process.env.PR_NUMBER);
            const commentTagPattern = `<!-- thollander/actions-comment-pull-request "${commentTag}" -->`;
            const body = `${fs.readFileSync(filePath, 'utf8')}\n${commentTagPattern}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.find((comment) => comment.body?.includes(commentTagPattern));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Post Payload Report as Comment
        continue-on-error: true
        if: steps.check_files.outputs.payload_reports == 'true'
        uses: actions/github-script@v9
        env:
          REPORT_FILE: action-scripts/brownie/payload_reports.txt
          COMMENT_TAG: payload_report
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const filePath = process.env.REPORT_FILE;
            const commentTag = process.env.COMMENT_TAG;
            const issueNumber = Number(process.env.PR_NUMBER);
            const commentTagPattern = `<!-- thollander/actions-comment-pull-request "${commentTag}" -->`;
            const body = `${fs.readFileSync(filePath, 'utf8')}\n${commentTagPattern}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.find((comment) => comment.body?.includes(commentTagPattern));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Prettify code
        uses: creyD/prettier_action@v4.5
        with:
          # This part is also where you can pass other options, for example:
          prettier_options: --write BIPs/**/*.json config/*.json MaxiOps/**/*.json OmniOps/**/*.json OmniAutoOps/**/*.json TreasuryOps/**/*.json
          commit_message: Automated processing of Payload PR (validations, transformations, and reports) + reformat JSON

      - name: Commit and push reports
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message:
          commit_user_name: GitHub Actions
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: Github Actions <noreply@users.noreply.github.com>

      - name: Clear Old Compiler Caches
        if: ${{ steps.restore-compiler-caches.outputs.cache-hit }}
        continue-on-error: true
        run: gh cache delete "evm-compiler-caches"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save EVM Compiler Caches
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.solcx
            ~/.vvm
          key: evm-compiler-caches
